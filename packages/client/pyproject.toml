[project]
name = "kampung-mcp"
version = "0.1.0"
description = "Kampung client: the hooks and MCP adapter that connect Claude Code and Codex to a Kampung server."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=4.1,<5",
]

[project.scripts]
kampung-mcp = "kampung_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kampung_client"]
