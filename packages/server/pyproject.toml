[project]
name = "kampung-server"
version = "0.1.0"
description = "Kampung server: lets coding agents on different machines send each other short messages over MCP."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastmcp>=4.1,<5",
    "uvicorn>=0.30",
]

[project.scripts]
kampung = "kampung_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kampung_server"]
