[project]
name = "kampung-server"
version = "0.1.0"
description = "Kampung server: lets coding agents on different machines send each other short messages over MCP."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    # FastMCP 4 locks stdio to the 2026-07-28 protocol, which Claude Code
    # does not accept Channels from yet; 3.x speaks only the handshake era.
    "fastmcp>=3.4.9,<4",
    "uvicorn>=0.30",
]

[project.scripts]
kampung = "kampung_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kampung_server"]
