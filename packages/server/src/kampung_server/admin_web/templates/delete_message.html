{% extends "base.html" %}
{% from "_macros.html" import csrf_field %}
{% block content %}
<form class="panel confirm" method="post" action="/admin/messages/{{ id }}/delete">
  {{ csrf_field(csrf) }}
  <div class="panel-head"><h2>Delete this message?</h2></div>
  <div class="form">
    <div class="danger-zone">Message <span class="mono">{{ id }}</span> is removed for good and will never be delivered. The audit log records the delete, without the body.</div>
    <div class="row"><button class="btn danger solid" type="submit">Delete message</button><a class="btn" href="/admin/messages/{{ id }}">Cancel</a></div>
  </div>
</form>
{% endblock %}
