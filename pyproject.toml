[project]
name = "kampung-workspace"
version = "0"
requires-python = ">=3.12"
dependencies = ["kampung-server"]

[tool.uv]
package = false

[tool.uv.sources]
kampung-server = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "black>=26",
    "flake8>=7",
    "mypy>=1.10",
    "pre-commit>=3.5",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["packages/server/tests"]
asyncio_mode = "auto"
