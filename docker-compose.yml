# No `version:` key: obsolete in Compose v2 and later.
services:
  kampung:
    image: ghcr.io/jztan/kampung-mcp:${KAMPUNG_IMAGE_TAG:-latest}
    build: .
    # Build locally until a release workflow publishes the image; then drop
    # this line so `docker compose pull` works.
    pull_policy: build
    env_file:
      - path: .env
        required: false
    environment:
      # Pinned so nothing in .env can move the app off the port the publish
      # targets, or the database off the volume.
      KAMPUNG_HTTP_HOST: 0.0.0.0
      KAMPUNG_HTTP_PORT: "8000"
      KAMPUNG_DB_PATH: /data/kampung.db
    # Published to loopback ONLY. TLS and public exposure belong to Caddy
    # (the `tls` profile below, or Caddy on the host).
    ports:
      - "127.0.0.1:${KAMPUNG_HOST_PORT:-8803}:8000"
    volumes:
      # Named volume, not a bind mount: it inherits uid 1000 ownership from
      # the image, so SQLite stays writable on a Linux host.
      - kampung-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3

volumes:
  kampung-data:
