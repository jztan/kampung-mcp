name: CLA

# Contributors sign CLA.md by commenting on their pull request. Signatures are
# stored in signatures/cla.json on the cla-signatures branch of this repo, so
# no outside service is involved. pull_request_target runs this workflow from
# the base branch and never checks out the contributor's code, which is what
# makes its write token safe to use on pull requests from forks.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-24.04
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/jztan/kampung-mcp/blob/develop/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: jztan,dependabot[bot],github-actions[bot]
