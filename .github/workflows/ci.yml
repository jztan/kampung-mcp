name: CI

# Feature, release and hotfix branches are tested through their pull
# request, so each commit gets one run instead of a push run that the PR run
# then cancels (a cancelled run shows as a failed check). To test a branch
# before opening its PR: gh workflow run CI --ref <branch>
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

# One run per commit: a newer run for the same commit cancels an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run black --check .
      - run: uv run flake8 packages scripts
      - run: uv run mypy packages/server/src packages/client/src
      - run: uv run pytest -q

  docker:
    # Builds the real image and drives the compose stack. Runs on Linux,
    # which is where a named volume's ownership actually matters.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q -m docker
        env:
          KAMPUNG_DOCKER_TESTS: "1"

  client-windows:
    # The client also runs on native Windows (hooks through Git Bash, the
    # Win32 process chain instead of ps); the server only ships on Linux.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q packages/client
