name: Deploy demo to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # An empty id would ship a page that loads gtag with no property, so stop here instead.
      - name: Inject GA4 measurement ID
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$GA_MEASUREMENT_ID" ]; then
            echo "::error::GA_MEASUREMENT_ID secret is not set"
            exit 1
          fi
          sed -i "s/__GA_MEASUREMENT_ID__/$GA_MEASUREMENT_ID/g" pages/index.html
      # On a tag the ref is the released version. On a manual dispatch from a
      # branch it is a branch name, so fall back to the version the server declares.
      - name: Inject Kampung version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          else
            version="v$(grep -m1 '^version = ' packages/server/pyproject.toml | cut -d '"' -f2)"
          fi
          echo "Injecting Kampung version: $version"
          sed -i "s/__KAMPUNG_VERSION__/$version/g" pages/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./pages
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
