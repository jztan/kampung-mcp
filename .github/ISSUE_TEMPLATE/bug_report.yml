name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

        Security problems should not be reported here. Use **Report a vulnerability** on the Security tab instead (see SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Pair laptop and desktop...
        2. From laptop/api, send to desktop/blog...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe expected behavior...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe actual behavior...
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server Version
      description: The version `/health` returns
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: client-version
    attributes:
      label: Client Version
      description: The `kampung-mcp` version on the machine with the problem (`uv tool list` shows it)
      placeholder: "0.1.0"
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the problem show up?
      options:
        - MCP tools (list_peers, send, inbox)
        - Hooks (mail announced, read at end of turn, loop guard)
        - Idle wake (Channels or codex queue)
        - kampung-mcp setup
        - Admin dashboard
        - kampung admin CLI
        - Docker / Caddy deployment
        - Other (specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Which agent is involved?
      options:
        - Claude Code
        - Claude Code with Channels
        - Codex
        - Other (specify in additional context)
        - Not agent-related
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: OS of the machine with the problem
      placeholder: "macOS 15, Windows 11, Ubuntu 24.04"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Any error messages or logs. Please remove machine keys, the admin token, domains and IP addresses
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information
    validations:
      required: false
