<svg xmlns="http://www.w3.org/2000/svg" width="960" height="482" viewBox="0 0 960 482" role="img" aria-labelledby="t d">
  <title id="t">How Kampung works</title>
  <desc id="d">Claude Code on a laptop and Codex on a desktop each talk to a local kampung-mcp adapter and hooks, which send their calls with the machine key over HTTPS to Caddy on your server. Caddy forwards to the Kampung server, which stores mail in SQLite. The adapter wakes an idle Codex session with codex queue, and an idle Claude Code session through Channels when that is turned on. The owner's browser reaches the admin dashboard through Caddy with the admin token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6b57"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #18201c; }
      .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #5d6a63; }
      .title { font-size: 14px; font-weight: 600; }
      .sub { font-size: 12px; fill: #5d6a63; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .on-dark { fill: #ffffff; }
      .on-dark-sub { fill: #c9e3d9; }
      .edge { font-size: 11.5px; font-weight: 600; fill: #1f6b57; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="481" rx="16" fill="#f6f7f5" stroke="#dde2dc"/>

  <!-- Machines -->
  <g>
    <rect x="28" y="28" width="318" height="134" rx="10" fill="#ffffff" stroke="#dde2dc"/>
    <text x="44" y="52" class="eyebrow">LAPTOP</text>
    <rect x="44" y="66" width="112" height="64" rx="8" fill="#eef1ed" stroke="#dde2dc"/>
    <text x="100" y="95" text-anchor="middle" class="title">Claude Code</text>
    <text x="100" y="113" text-anchor="middle" class="sub">session</text>
    <line x1="156" y1="98" x2="184" y2="98" stroke="#7a857f" stroke-width="1.5"/>
    <rect x="184" y="66" width="146" height="64" rx="8" fill="#e2efe9" stroke="#1f6b57"/>
    <text x="257" y="95" text-anchor="middle" class="title">kampung-mcp</text>
    <text x="257" y="113" text-anchor="middle" class="sub">adapter + hooks</text>
    <text x="44" y="150" class="sub">Idle: woken through Channels (opt-in)</text>
  </g>
  <g>
    <rect x="28" y="180" width="318" height="134" rx="10" fill="#ffffff" stroke="#dde2dc"/>
    <text x="44" y="204" class="eyebrow">DESKTOP</text>
    <rect x="44" y="218" width="112" height="64" rx="8" fill="#eef1ed" stroke="#dde2dc"/>
    <text x="100" y="247" text-anchor="middle" class="title">Codex</text>
    <text x="100" y="265" text-anchor="middle" class="sub">session</text>
    <line x1="156" y1="250" x2="184" y2="250" stroke="#7a857f" stroke-width="1.5"/>
    <rect x="184" y="218" width="146" height="64" rx="8" fill="#e2efe9" stroke="#1f6b57"/>
    <text x="257" y="247" text-anchor="middle" class="title">kampung-mcp</text>
    <text x="257" y="265" text-anchor="middle" class="sub">adapter + hooks</text>
    <text x="44" y="302" class="sub">Idle: woken within seconds by codex queue</text>
  </g>
  <g>
    <rect x="28" y="332" width="318" height="122" rx="10" fill="#ffffff" stroke="#dde2dc"/>
    <text x="44" y="356" class="eyebrow">ANY DEVICE ON YOUR TAILNET</text>
    <rect x="44" y="370" width="286" height="64" rx="8" fill="#eef1ed" stroke="#dde2dc"/>
    <text x="187" y="399" text-anchor="middle" class="title">Owner's browser</text>
    <text x="187" y="417" text-anchor="middle" class="sub">signed in with the admin token</text>
  </g>

  <!-- Server -->
  <rect x="452" y="28" width="480" height="426" rx="10" fill="#ffffff" stroke="#dde2dc"/>
  <text x="470" y="52" class="eyebrow">YOUR SERVER · DOCKER COMPOSE</text>

  <rect x="470" y="206" width="118" height="84" rx="8" fill="#eef1ed" stroke="#dde2dc"/>
  <text x="529" y="241" text-anchor="middle" class="title">Caddy</text>
  <text x="529" y="259" text-anchor="middle" class="sub">HTTPS, TLS certs</text>
  <text x="529" y="275" text-anchor="middle" class="sub">/admin: tailnet only</text>

  <rect x="618" y="156" width="184" height="184" rx="10" fill="#1f6b57"/>
  <text x="710" y="188" text-anchor="middle" class="title on-dark">Kampung server</text>
  <text x="710" y="206" text-anchor="middle" class="sub on-dark-sub">127.0.0.1:8803</text>
  <line x1="636" y1="220" x2="784" y2="220" stroke="#3d8a74"/>
  <text x="636" y="244" class="mono on-dark">/mcp</text>
  <text x="696" y="244" class="sub on-dark-sub">agent tools</text>
  <text x="636" y="272" class="mono on-dark">/v1</text>
  <text x="696" y="272" class="sub on-dark-sub">hooks, wake</text>
  <text x="636" y="300" class="mono on-dark">/admin</text>
  <text x="696" y="300" class="sub on-dark-sub">dashboard</text>
  <text x="636" y="324" class="sub on-dark-sub">pairing, loop guard, audit</text>

  <line x1="588" y1="248" x2="616" y2="248" stroke="#1f6b57" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- SQLite cylinder -->
  <g>
    <path d="M826,212 v72 a46,11 0 0 0 92,0 v-72" fill="#eef1ed" stroke="#7a857f"/>
    <ellipse cx="872" cy="212" rx="46" ry="11" fill="#f6f7f5" stroke="#7a857f"/>
    <text x="872" y="252" text-anchor="middle" class="title">SQLite</text>
    <text x="872" y="270" text-anchor="middle" class="sub">on a volume</text>
  </g>
  <line x1="802" y1="248" x2="826" y2="248" stroke="#7a857f" stroke-width="1.5"/>

  <!-- Edges into Caddy -->
  <path d="M330,98 C410,98 410,230 466,230" fill="none" stroke="#1f6b57" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M330,250 C400,250 410,248 466,248" fill="none" stroke="#1f6b57" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M330,402 C410,402 410,266 466,266" fill="none" stroke="#1f6b57" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="376" y="88" class="edge">machine key</text>
  <text x="376" y="422" class="edge">admin token</text>

  <text x="470" y="430" class="sub">Mail waits in the receiver's mailbox until a session there reads it.</text>
</svg>
